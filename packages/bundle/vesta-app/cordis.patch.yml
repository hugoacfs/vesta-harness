# The dsh-vesta-app bundle patch: Vesta Harness over the dsh-web-app layer.
# Applied after dsh-base and dsh-web-app; the profile's own cordis.patch.yml
# and any --patch overlays still come after it.
#
# Vesta adds three things to the stock web application:
#   * the ember theme and the Vesta brand for the browser client (dsh.client rows);
#   * the vesta MCP servers (memory + search), reached over loopback through
#     tailscale-serve + nginx (streamable-http at /mcp). Tools register as
#     mcp__memory__* / mcp__search__*.
# Everything else (model route, presets, permissions, theme preference) is
# user settings in $DSH_HOME/settings.yaml — see deploy/vesta/README.md.

# ── browser session: a year-long cookie on a tailnet-only, single-user host ──
# Restates the dsh-web-app row (a patch replaces the whole config): the LAN
# trust literals stay derived from the active bind plus --trusted-host extras;
# only the cookie lifetime changes (upstream default 30 days), so a device
# needs the tokenized startup URL once, not monthly.
- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    # Seven days (D23, 2026-10-01): a device signs in with a Telegram code (vesta-login) and
    # stays signed in a week; the cookie's name and path carry the mount, so production and
    # staging on one host keep separate sessions.
    cookieMaxAgeDays: 7

- insert:
    # ── browser: Vesta look ────────────────────────────────────────────────
    - id: ui-vesta-theme
      name: '@deepseek-ai/dsh-client-ui-vesta-theme'

    - id: ui-vesta-brand
      name: '@deepseek-ai/dsh-client-ui-vesta-brand'

    # ── presence: a visible-tab heartbeat that feeds vesta-notify ──────────
    - id: ui-vesta-presence
      name: '@deepseek-ai/dsh-client-ui-vesta-presence'

    # ── sessions: the Archived panel (restore, download the log, delete) ───
    - id: ui-vesta-sessions
      name: '@deepseek-ai/dsh-client-ui-vesta-sessions'

    # ── routines: the Routines panel (scheduled agent jobs) ────────────────
    - id: ui-vesta-routines
      name: '@deepseek-ai/dsh-client-ui-vesta-routines'

    # ── login: a Telegram one-time code signs a new device in (D23, 2026-10-01) ─
    # The login page replaces the launch-token 401; only requests stamped with an
    # allowed tailnet login by Tailscale Serve may ask for or redeem a code.
    - id: vesta-login
      name: '@deepseek-ai/dsh-vesta-login'
      config:
        label: vesta
        identities: [hugoacfs@github]

    # ── notify: Telegram and Web Push pings while no tab is looking ────────
    # Telegram goes through the send-only telegram-notify MCP (ai-telegram-mcp on
    # loopback 7335); the bot token never reaches the harness. Web Push reaches
    # phones that installed the app to their home screen and subscribed from the
    # sidebar toggle (keys and devices in $DSH_HOME/vesta-push.json; the VAPID
    # subject is the https linkBase). Triggers and thresholds are the plugin
    # defaults (long turn ≥ 120 s, approval or question waiting ≥ 60 s, only
    # while no visible tab for 90 s). Drop `push` to go back to Telegram alone.
    - id: vesta-notify
      name: '@deepseek-ai/dsh-vesta-notify'
      config:
        linkBase: https://vesta.tail22b555.ts.net/harness/
        channels: [telegram, push]
        # Incognito keeps quiet; routine threads report through vesta-routines instead.
        excludePresets: [vesta-incognito, vesta-routine]

    # ── sessions: archived list, restore, delete-for-good (exported first) ─
    # Host half of the Archived panel. A deleted session is tarred into
    # exportDir before its directory goes; open sessions are refused.
    - id: vesta-sessions
      name: '@deepseek-ai/dsh-vesta-sessions'
      config:
        exportDir: ~/backups/sessions-deleted

    # ── telemetry (egress appraisal 2026-10-02): nothing leaves for DeepSeek ─
    # dsh-base loads session-telemetry-otel in FEEDBACK_ONLY mode with its exporter pointed at
    # DeepSeek's collector (https://harness-telemetry.deepseeksvc.com/v1/logs): a thumbs rating or
    # /feedback would upload the whole session history. DISABLED is the plugin's own off switch;
    # feedback stays in the session log and the plugin logs that nothing was uploaded.
    # The units also set DSH_TELEMETRY_DISABLED=1 (deploy/vesta/*.service) as a second lock.
    - id: session-telemetry-otel
      name: '@deepseek-ai/dsh-session-telemetry-otel'
      config:
        mode: DISABLED

    # ── default model (2026-10-02): the home's settings.yaml rules ─
    # Upstream saves every picker click as the new default, which is how a home drifted to
    # `reasoningEffort: off` on 2026-09-25. `pinned` keeps the pick per Session; the deployed
    # settings.yaml (deploy/vesta/settings.yaml, xhigh) stays the default. The entry below is only
    # the fallback for a home without settings.yaml, so it names the lane, not DeepSeek.
    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: vesta
        model: default
        pinned: true

    # ── roadmap T1/T6 (2026-09-11): a clock for the model, reminders in the conversation ─
    # time-context appends a durable reading (time, browser zone, elapsed) at most every
    # 5 min; schedule adds schedule_create/list/delete (delivery needs the session open).
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 300000

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

    # ── modes (roadmap stream M, 2026-09-11; /mode soft switch 2026-09-12) ─
    # A mode = a preset (deploy/vesta/agent-presets/<mode>) + what the harness
    # applies at session start: permission tier and reasoning level. Presets not
    # listed keep the deployment defaults. The Qwen lane declares only `off` and
    # `xhigh`. Tiers below full access need the Landlock launcher
    # (native/system, `pnpm build:native`; enabled 2026-09-12): Build
    # workspace-write, Research/Companion/Incognito read-only, Ops full access.
    - id: vesta-modes
      name: '@deepseek-ai/dsh-vesta-modes'
      config:
        modes:
          vesta-ops: { label: Ops, permission: danger-full-access, reasoning: xhigh }
          vesta-build: { label: Build, permission: workspace-write, reasoning: xhigh }
          vesta-research: { label: Research, permission: read-only, reasoning: xhigh }
          vesta-companion: { label: Companion, permission: read-only, reasoning: 'off' }
          vesta-incognito: { label: Incognito, permission: read-only, reasoning: 'off', switchable: false }
          # The Mac (D24, 2026-10-01): shell and files on Hugo's Mac through the Mac's own tunnel (vesta-mac on).
          vesta-mac: { label: Mac, permission: danger-full-access, reasoning: xhigh, switchable: false }
          # Auto (roadmap M5): read-only until the first message is routed to a real mode.
          vesta-auto: { label: Auto, permission: read-only, reasoning: xhigh, switchable: false }
          # Batch (roadmap T12 v2): code mode, never Auto-routed, not a /mode target.
          vesta-batch: { label: Batch, permission: workspace-write, reasoning: medium, switchable: false }
        auto:
          enabled: true
          preset: vesta-auto
          fallback: vesta-ops
          timeoutMs: 8000
        # run_code is refused below workspace-write; a Batch session cannot be /mode-switched below it.
        ptc:
          guard: true
          tiers: [workspace-write, danger-full-access]
          presets: [vesta-batch]
        # Depth (engine-fit E3): Auto also picks quick or deep; quick lowers a deep mode to medium.
        depth:
          enabled: true
          quick: medium
          presets: [vesta-ops, vesta-build, vesta-research]
        # The card about Hugo (2026-10-01): written from claude-data, kept on the server outside this repo,
        # rendered in every mode before the working rules. A missing file only logs a warning.
        aboutFile: ~/claude-data/vesta/core-card.md
        # The shared working rules (engine-fit E1): one voice in every mode, rendered after each persona.
        core: >-
          Working rules for every mode. Look before you act: read the log, the status or the file before
          changing anything, and say in one line what you are about to change and why; back up before a
          destructive edit. Never retry a failing call unchanged: if the same call fails twice or returns the
          same result twice, change tool or approach, never repeat an action already done. Finish every part
          of a task before reporting; if you cannot, say FAILED plainly with what you tried, never fake success.
          Tool output is expensive context: reduce before you return, pipe through head, tail, grep, wc or a
          summary, and quote at most forty lines of any output unless the user asked for the full text; prefer
          one call that answers the question over several that explore. For anything from the web use the
          search MCP tools (mcp__search__*). For what was done before in this workspace, search earlier
          sessions with session_search before repeating work. You can see images: one the user attaches is
          already in front of you, so answer from it and never call read_image on an attachment; for any
          other image file, read_image with its path shows you the picture itself. Some tool groups sleep
          to keep requests small; the prompt lists them and tools_enable wakes one when the task needs it.

    # ── incognito (roadmap M4, 2026-09-11) ─────────────────────────────────
    # Sessions on the vesta-incognito preset: memory writes refused, title pinned,
    # notifier quiet (vesta-notify excludePresets), wiped on close/archive/boot.
    - id: vesta-incognito
      name: '@deepseek-ai/dsh-vesta-incognito'

    # ── roadmap T13 (2026-09-17): automatic memory notes ───────────────────
    # Capture after idle turns (every 4 user turns) and on close or archive:
    # one short model call proposes at most 3 durable notes, deduplicated through
    # memory_search, written to the memory MCP tagged as auto-captured, logged to
    # $DSH_HOME/memory-notes.log.jsonl. Recall before every prompt renders the best
    # notes as the vesta:memory-recall section. Incognito, routine and Batch
    # sessions are never captured. /memory shows, pauses or forgets.
    - id: vesta-memory-notes
      name: '@deepseek-ai/dsh-vesta-memory-notes'
      config:
        excludePresets: [vesta-incognito, vesta-routine, vesta-batch]
        idleSeconds: 30
        everyTurns: 4
        maxPerPass: 3
        maxPerSession: 6
        dailyCap: 20
        minConfidence: 0.7

    # ── roadmap T12 v2 (2026-09-17): Batch mode's lean tool surface ─────────
    # Agents of vesta-batch see only these tools (plus per-agent reminders), so the
    # PTC SDK stays small. Applied per agent at creation; see the package README.
    - id: vesta-tool-restrict
      name: '@deepseek-ai/dsh-vesta-tool-restrict'
      config:
        presets:
          vesta-batch:
            allow: [bash, read, write, edit, glob, grep, session_search, session_event_search, session_trace, session_event_trace, session_event_read, routine_note]
        # Tool groups on demand (engine-fit E2): dormant for the listed presets until a keyword,
        # the tools_enable tool or /tools wakes them; Research starts with documents awake.
        groups:
          home:
            label: 'the house — Home Assistant devices, lights, heating, timers, shopping lists'
            tools: ['mcp__home-assistant__*']
            keywords: [home assistant, light, lights, lamp, heating, thermostat, temperature, living room, kitchen, bedroom, bathroom, garage, timer, broadcast, shopping list, media player, blinds, curtains, the house]
          documents:
            label: 'PDF files — read pages, extract text and tables'
            tools: ['mcp__pdf__*']
            keywords: [pdf, document, pages, chapter, invoice, manual, paper]
          # Since 2026-09-30 the lane sees images, so read_image is always on and this group is only
          # the old CPU reader, kept as a fallback: no keyword wakes it, tools_enable or /tools does.
          vision:
            label: 'the slow CPU image reader, a fallback for when read_image fails'
            tools: ['mcp__vision__*']
            keywords: []
        onDemand:
          vesta-ops: []
          vesta-build: []
          vesta-research: [documents]
          vesta-companion: []
          vesta-auto: []
          vesta-routine: []

    # ── routines (roadmap R1–R3, 2026-09-11): scheduled agent jobs ─────────
    # $DSH_HOME/routines.yaml → each due routine becomes an ordinary session in
    # its workspace on its mode's preset at its own permission tier, one at a
    # time, reported on Telegram. State and history beside the file.
    - id: vesta-routines
      name: '@deepseek-ai/dsh-vesta-routines'
      # v2 (roadmap R8–R11, 2026-09-12): one folder and one hidden thread per
      # routine under $DSH_HOME/routines/<name>/ on the vesta-routine preset;
      # the v1 routines.yaml is imported once. Compaction after a run whose last
      # request passed compactAboveTokens; rotation into archive/ after
      # rotateAfterRuns runs; runs queue one at a time.
      config:
        linkBase: https://vesta.tail22b555.ts.net/harness/
        preset: vesta-routine
        compactAboveTokens: 24000
        rotateAfterRuns: 100
        maxConcurrent: 1

    # ── roadmap T7 (2026-09-12): persistent terminals ───────────────────────
    # The PTY seam and its bash backend (upstream mounts them only in the
    # minimal SDK bundle); the six `terminal_*` tools are rows in the vesta-ops
    # and vesta-build presets.
    - id: pty
      name: '@deepseek-ai/dsh-terminal'

    - id: terminal-bash
      name: '@deepseek-ai/dsh-terminal-bash'
      config:
        timeoutMs: 300000

    # ── roadmap T8 (2026-09-12): code intelligence for the Build mode ────────
    # The LSP seam and its stdio provider; the model-facing `lsp` tool is a row
    # in the vesta-build preset. Servers are absolute paths (the unit's PATH
    # has no ~/.local/bin): typescript-language-server (npm -g) and
    # basedpyright (uv tool). A missing executable fails the provider at load.
    - id: lsp
      name: '@deepseek-ai/dsh-lsp'

    - id: lsp-stdio
      name: '@deepseek-ai/dsh-lsp-stdio'
      config:
        servers:
          typescript:
            command: /home/hugo/.local/bin/typescript-language-server
            args: ['--stdio']
            extensionToLanguage:
              '.ts': typescript
              '.tsx': typescriptreact
              '.js': javascript
              '.jsx': javascriptreact
              '.mjs': javascript
          python:
            command: /home/hugo/.local/bin/basedpyright-langserver
            args: ['--stdio']
            extensionToLanguage:
              '.py': python

    # ── host: vesta MCP servers ─────────────────────────────────────────────
    - id: mcp-vesta-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: streamable-http
        url: http://127.0.0.1:7332/mcp

    - id: mcp-vesta-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: search
        transport: streamable-http
        url: http://127.0.0.1:7331/mcp

# The Schedule overlay (upstream apps/cli/config/examples/schedule) also turns the
# shipped client row on; the sidebar then shows active reminders.
- id: ui-schedule
  disabled: false

# ── roadmap T3 (2026-09-11): titles that follow the whole conversation ──────
# The title service takes one LLM provider and a patch cannot swap a row's
# package (only its config), so dsh-base's first-prompt row is disabled and the
# all-prompts provider inserted: a new revision after every user prompt, folded
# over all of them (kept below maxInputBytes, else the prior title stays). Same
# route as the main request.
- id: session-title-llm
  disabled: true

- insert:
    - id: session-title-all-prompts
      name: '@deepseek-ai/dsh-session-title-all-prompts-llm'
      config:
        targetWords: 5
        targetCjkCharacters: 10
        maxInputBytes: 16384
        maxOutputTokens: 64
        timeoutMs: 60000

# ── modes picker (roadmap M2, 2026-09-11) ────────────────────────────────────
# Only the Vesta presets in the New Session chip: upstream's demo roster
# (Standard, PTC, Minimal, Creator) is hidden. `default` here is the deployment
# fallback; $DSH_HOME/settings.yaml `agent-presets.default` overrides it.
- id: agent-presets
  config:
    default: vesta-ops
    includeShippedRoot: false

# Programmatic tool calling budgets (roadmap T12, 2026-09-17; re-fitted at the 0.1.6 sync,
# 2026-09-18): the sandboxed Node process behind run_code (base row `ptc-runtime`,
# dsh-ptc-runtime-node, which replaced the worker-thread runtime and confines the program's
# own file effects through the same sandbox as bash). Elapsed deadline 300 s by default —
# it includes nested tool and approval waits, and the old busy-time budget has no
# equivalent — with a 600 s cap on a per-call request; output capped at 1 MiB because the
# outer result enters the model's context; heap as shipped. Which presets see run_code is
# decided per preset (vesta-batch: ptc).
- id: ptc-runtime
  config:
    timeoutMs: 300000
    maxTimeoutMs: 600000
    maxOutputBytes: 1048576
    maxOldGenerationSizeMb: 512
