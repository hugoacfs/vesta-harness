# The dsh-vesta-app bundle patch: Vesta Harness over the dsh-web-app layer.
# Applied after dsh-base and dsh-web-app; the profile's own cordis.patch.yml
# and any --patch overlays still come after it.
#
# Vesta adds three things to the stock web application:
#   * the ember theme and the Vesta brand for the browser client (dsh.client rows);
#   * the vesta MCP servers (memory + search), reached over loopback through
#     tailscale-serve + nginx (streamable-http at /mcp). Tools register as
#     mcp__memory__* / mcp__search__*.
# Everything else (model route, presets, permissions, theme preference) is
# user settings in $DSH_HOME/settings.yaml — see deploy/vesta/README.md.

# ── browser session: a year-long cookie on a tailnet-only, single-user host ──
# Restates the dsh-web-app row (a patch replaces the whole config): the LAN
# trust literals stay derived from the active bind plus --trusted-host extras;
# only the cookie lifetime changes (upstream default 30 days), so a device
# needs the tokenized startup URL once, not monthly.
- id: connection
  inject: [webRuntime]
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    cookieMaxAgeDays: 365

- insert:
    # ── browser: Vesta look ────────────────────────────────────────────────
    - id: ui-vesta-theme
      name: '@deepseek-ai/dsh-client-ui-vesta-theme'

    - id: ui-vesta-brand
      name: '@deepseek-ai/dsh-client-ui-vesta-brand'

    # ── voice: a LiveKit call as a modality of the Session ─────────────────
    # Browser half: the composer mic button and the call HUD.
    - id: ui-vesta-voice
      name: '@deepseek-ai/dsh-client-ui-vesta-voice'

    # ── presence: a visible-tab heartbeat that feeds vesta-notify ──────────
    - id: ui-vesta-presence
      name: '@deepseek-ai/dsh-client-ui-vesta-presence'

    # ── sessions: the Archived panel (restore, download the log, delete) ───
    - id: ui-vesta-sessions
      name: '@deepseek-ai/dsh-client-ui-vesta-sessions'

    # Host half: room tokens, the agent bridge upgrade route, the spoken-mode
    # prompt section, and the perception-toggle proxy. LiveKit credentials are
    # credential references (LIVEKIT_API_KEY / LIVEKIT_API_SECRET in
    # $DSH_HOME/.credentials.yaml); the SFU and the STT sidecar are the vesta
    # livekit-voice stack (tailscale serve :8481 → livekit-server, loopback
    # :8011 → livekit-media).
    - id: vesta-voice
      name: '@deepseek-ai/dsh-vesta-voice'
      config:
        livekitUrl: wss://vesta.tail22b555.ts.net:8481
        mediaUrl: http://127.0.0.1:8011

    # ── notify: Telegram pings while no tab is looking ─────────────────────
    # Delivery through the send-only telegram-notify MCP (ai-telegram-mcp on
    # loopback 7335); the bot token never reaches the harness. Triggers and
    # thresholds are the plugin defaults (long turn ≥ 120 s, approval or
    # question waiting ≥ 60 s, only while no visible tab for 90 s).
    - id: vesta-notify
      name: '@deepseek-ai/dsh-vesta-notify'
      config:
        linkBase: https://vesta.tail22b555.ts.net/harness/

    # ── sessions: archived list, restore, delete-for-good (exported first) ─
    # Host half of the Archived panel. A deleted session is tarred into
    # exportDir before its directory goes; open sessions are refused.
    - id: vesta-sessions
      name: '@deepseek-ai/dsh-vesta-sessions'
      config:
        exportDir: ~/backups/sessions-deleted

    # ── host: vesta MCP servers ─────────────────────────────────────────────
    - id: mcp-vesta-memory
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memory
        transport: streamable-http
        url: http://127.0.0.1:7332/mcp

    - id: mcp-vesta-search
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: search
        transport: streamable-http
        url: http://127.0.0.1:7331/mcp
