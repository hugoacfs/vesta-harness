# User preset vesta-mac: shell and filesystem tools connect to the signed-in Mac over the
# OpenSSH alias `vesta-mac` (127.0.0.1:2222 on Vesta, the Mac's own reverse tunnel; deploy/vesta/mac/). The Harness session, workspace record, and file pane remain on Vesta.
# Use explicit absolute Mac paths; the Web session cwd remains the local Vesta workspace.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Single-agent: no delegation guidance; folds in the worker discipline that
# proved effective, and points web lookups at the on-box search MCP.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # `prefix` (was `text` before the 0.1.5 sync): dsh-persona renders it as the
    # deployment:persona-prefix section; the omitted `suffix` shadows the global one.
    prefix: >-
      You are Vesta Mac, a coding agent powered by the {{model}} model. This session's shell and filesystem tools run on Hugo's Mac through a tunnel the Mac opened to Vesta; the Vesta workspace in the session header and file pane stays on Vesta and is not the Mac.

      The machine: a MacBook on Apple silicon (arm64), macOS 26.5, hostname 00-G3-041484-26, account u2370878, home /Users/u2370878, default shell zsh (scripts run on bash 3.2: no BASHPID, no associative arrays). It is managed by Hugo's employer (University of Warwick): no sudo, no system settings, no installs that need an administrator; Homebrew at /opt/homebrew is fine for user-level tools. Available: git 2.50, Python 3.9 (system), Node 22 at /Users/u2370878/.local/bin, the Xcode Command Line Tools (clang, swiftc), Tailscale. Hugo's repositories live under /Users/u2370878/Code (vesta-harness, vesta-voice, deepseek-harness and others). Desktop and Documents are synced to OneDrive and are not readable from this connection (permission denied is the Mac's privacy setting, not a transient fault); Downloads and everything else in the home are. The door you came through is /Users/u2370878/.vesta-mac: never change it and never run vesta-mac off, which would cut your own connection.

      This Web session's cwd and file pane stay on Vesta, so always set Bash workdir to /Users/u2370878 (or another absolute Mac path) and use absolute Mac paths for filesystem tools. Relative paths resolve from the Vesta session cwd and do not name Mac files. The Mac must be awake, on Tailscale, with vesta-mac on; if the SSH helper reports a disconnect, say so plainly and stop, the harness needs a restart before the Mac answers again.

      Work directly and carefully. Read a file before changing it. Session commands have the signed-in Mac account's full permissions, so treat the Mac as Hugo's own desk: no deletions, no commits or pushes, nothing sent off the machine, unless the task says so.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# The standard session workspace and file pane remain on Vesta. Model-facing tools must
# receive explicit absolute Mac paths because their session cwd stays on Vesta.
- id: mac-remote-runtime
  name: cordis:group
  group: true
  isolate:
    ssh: true
    fs: true
    subprocess: true
    sandbox: true
    sandboxPolicy: true
    shell: true
  config:
    - id: ssh
      name: '@deepseek-ai/dsh-ssh'
      config:
        host: vesta-mac
        node: /Users/u2370878/.vesta-mac/helper/node
        helper: /Users/u2370878/.vesta-mac/helper/node_modules/@deepseek-ai/dsh-ssh/lib/helper.js
        helperHash: bd0020c9f27544af1179dadcd16047b70ec565dfdf6e5d26b87aca95c06027a9
        workspace: /Users/u2370878

    - id: fs-ssh
      name: '@deepseek-ai/dsh-fs-ssh'

    - id: subprocess-ssh
      name: '@deepseek-ai/dsh-subprocess-ssh'

    - id: sandbox-ssh
      name: '@deepseek-ai/dsh-sandbox-ssh'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: danger-full-access
        workspaceRoot: /Users/u2370878

    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'

    - id: tool-bash
      name: '@deepseek-ai/dsh-tool-bash'
      config:
        enableRunInBackground: false

    - id: tool-fs
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-fs-search
      name: '@deepseek-ai/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

# Search its own earlier sessions (roadmap T2, 2026-09-11): five read-only tools over
# ctx.sessionQuery (search, matches, trace, event read); cross-session reads only within
# the same cwd, so Ops history is reachable from Ops sessions.
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'

# `present` (upstream 0.1.5): the model hands finished files to the user as download
# cards ("immutable file deliveries"). Bare tool row, no realm. Added 2026-09-11 with the
# upstream sync; upstream's `standard` preset carries the same row after `tool-web`.

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it. `tokenMeter` stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      # Context discipline, retuned 2026-10-02 from 14 days of production logs
      # (P26): at 0.5 of the 114k window with 16k-token summaries, compaction
      # fired every ~3 steps (329 times in 40 sessions), each summary a median
      # 9.1k tokens — 45% of every completion token the lane produced. 0.7 keeps
      # 34k of headroom for a full 32k reply; 6144 caps the checkpoint at about
      # a third of what the model wrote when allowed 16k. retainRatio stays at
      # its 0.16 default. Revert: thresholdRatio 0.5, maxTokens 16384.
      config:
        thresholdRatio: 0.7
        maxTokens: 6144

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
#
# REMOVED for vesta-default. This is the single-agent default: no subagent,
# subagent_fork, subagent-control/list_agents, workflow, or ralph tools, and no
# persona guidance to delegate. Switch the session to the `vesta-orch` preset
# when you actually want fan-out / context isolation across children.

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── web search ───────────────────────────────────────────────────────────────
#
# DeepSeek `tool-web` (web_search / web_fetch) REMOVED for vesta-default. The
# only search path is the on-box search MCP (SearXNG + crawl4ai over VPN egress),
# mounted host-plane in $DSH_HOME/cordis.patch.yml and exposed as
# `mcp__search__*`. Re-add `@deepseek-ai/dsh-tool-web` here to restore it.
