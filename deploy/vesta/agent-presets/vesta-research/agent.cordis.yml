# User preset `vesta-research` — the Research mode (roadmap stream M, 2026-09-11):
# search, read, summarise with sources. Composition = `vesta-default` without plan
# mode and goals, with the Research persona. Permission tier and reasoning come from
# the `vesta-modes` host plugin: full access and xhigh today, read-only once a sandbox
# runner exists.
#
# AGENT-PLANE composition: a service row MUST sit inside a group with an `isolate`
# realm; bare tool rows need none.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # `prefix` (was `text` before the 0.1.5 sync): dsh-persona renders it as the
    # deployment:persona-prefix section; the omitted `suffix` shadows the global one.
    prefix: >-
      You are Vesta, a research assistant powered by the {{model}} model. Your working directory is {{cwd}}.

      Research mode: find out, do not guess. Search first (mcp__search__web_search, mcp__search__news_search),
      fetch the pages that matter (mcp__search__fetch_url), and end every answer with its sources — title and
      URL, nothing invented. Say what is uncertain or disputed. Keep answers proportionate: a direct question
      gets a short answer with two or three sources; a brief gets a summary first, then headings. PDFs: the
      mcp__pdf__* tools work on files under /srv/ai/pdf-mcp/work. Images and screenshots: mcp__vision__read_image
      with the absolute path (a local CPU model, 20–120 s). Earlier research in this workspace: session_search.
      Save notes only under {{cwd}}, and only when asked.

      Never retry a failing search with the same query — change the query or the tool. If the web has nothing,
      say so plainly rather than filling the gap.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Search its own earlier sessions (roadmap T2, 2026-09-11): five read-only tools over
# ctx.sessionQuery (search, matches, trace, event read); cross-session reads only within
# the same cwd, so Ops history is reachable from Ops sessions.
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'

# `present` (upstream 0.1.5): the model hands finished files to the user as download
# cards ("immutable file deliveries"). Bare tool row, no realm. Added 2026-09-11 with the
# upstream sync; upstream's `standard` preset carries the same row after `tool-web`.
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it. `tokenMeter` stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      # Tier-1 context discipline (2026-08-19): compact at 50% of the routed
      # context window (default is 0.8) so working context stays well under the
      # gateway cache and long writes keep headroom. retainRatio stays at its
      # 0.16 default. Revert: remove this config block.
      config:
        thresholdRatio: 0.5
        maxTokens: 16384

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
#
# REMOVED for vesta-default. This is the single-agent default: no subagent,
# subagent_fork, subagent-control/list_agents, workflow, or ralph tools, and no
# persona guidance to delegate. Switch the session to the `vesta-orch` preset
# when you actually want fan-out / context isolation across children.

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# ── web search ───────────────────────────────────────────────────────────────
#
# DeepSeek `tool-web` (web_search / web_fetch) REMOVED for vesta-default. The
# only search path is the on-box search MCP (SearXNG + crawl4ai over VPN egress),
# mounted host-plane in $DSH_HOME/cordis.patch.yml and exposed as
# `mcp__search__*`. Re-add `@deepseek-ai/dsh-tool-web` here to restore it.
