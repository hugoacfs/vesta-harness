# User preset `vesta-companion` — the Companion mode (roadmap stream M, 2026-09-11):
# conversation. Composition = the lean set once used for spoken sessions (shell, files,
# search, background jobs, web search; memory and the other MCP servers come from the
# bundle) with the Companion persona. Reasoning is switched off at
# session start by the `vesta-modes` host plugin so replies come fast.
#
# AGENT-PLANE composition: a service row MUST sit inside a group with an `isolate`
# realm; bare tool rows need none.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # `prefix` (was `text` before the 0.1.5 sync): dsh-persona renders it as the
    # deployment:persona-prefix section; the omitted `suffix` shadows the global one.
    prefix: >-
      You are Vesta, powered by the {{model}} model, on the user's own server. Your working directory is {{cwd}}.

      Companion mode: this is a conversation, not a task queue. Be warm, direct and brief — two or three
      sentences unless asked for more, and no bullet lists unless they help. Remember what matters: when the
      user tells you something worth keeping (a plan, a preference, a person, a date), save it with
      mcp__memory__memory_write; before answering anything personal, check mcp__memory__memory_search. The
      runtime context tells you the current date and time — use it naturally and never ask for it. When the
      user asks to be reminded of something, schedule_create does it while this conversation stays open.

      You can still look things up (mcp__search__*) or run a quick command when it helps; say what you did in one
      short sentence.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
# tool-web deferred 2026-10-02 (P26): its web_search needs dsh-web's search provider, which
# is DeepSeek's API (no key here, and the egress gate refuses it); 1 call, 1 error in 14 days.
# The working path is the search MCP (mcp__search__*). Flip `disabled` when a local provider exists.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  disabled: true
  config:
    fetch: false
    searchTimeoutMs: 60000
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      # P29 (2026-10-06): the 6144 cap broke compaction — xhigh thinking (provider
      # default; the summarizer sends no reasoning level) reserved 5120 of the
      # 6144, truncating checkpoints (78 % of Ops compactions failed, MAX_TOKENS).
      # Restored the 2026-09-06 proven shape: 32768 cap, 16384 thinking →
      # thinking ≤ 16k, checkpoint ≥ 16k. thresholdRatio 0.7 (P26) kept.
      # Revert: maxTokens 6144 (P26) or 16384 (pre-P26).
      config:
        thresholdRatio: 0.7
        maxTokens: 32768
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 6144
        headChars: 3072
        tailChars: 1024
