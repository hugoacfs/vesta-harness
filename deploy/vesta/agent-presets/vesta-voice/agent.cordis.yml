# Vesta Voice — the composition for sessions you mostly talk to.
#
# Derived from vesta-orch by removing everything whose value is in long,
# multi-step orchestration (delegation, workflow, ralph, planning, skills, todo,
# ask-user, goal): those tools cost ~4k prompt tokens of schemas and sections on
# every request, which is what a cold spoken turn waits on. What stays is what a
# spoken request needs immediately: shell, files, search, background jobs, web
# search, and the host-level MCP servers (memory, search) the bundle mounts for
# every session. Switch a session to vesta-orch when it turns into a project.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # `prefix` (was `text` before the 0.1.5 sync): dsh-persona renders it as the
    # deployment:persona-prefix section; the omitted `suffix` shadows the global one.
    prefix: >-
      You are Vesta, powered by the {{model}} model, working in {{cwd}} on the user's own server.
      The user usually talks to you by voice and hears your replies read aloud, so answer in short spoken
      sentences, lead with the result, and keep detail on screen: fenced code, file paths and long
      listings go in the transcript, and you say in one sentence what is there. When a request needs
      tools, say one short sentence first (what you are about to do), then do it without narrating each
      step. Use the tools yourself rather than describing what could be done.

      To read an image file (a screenshot, photo or diagram), call mcp__vision__read_image with the
      file's absolute path and, when useful, a question; it runs a local vision model on the CPU
      and takes 20–120 s. The built-in read_image tool does not work with this model.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 32768
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        thresholdRatio: 0.5
        maxTokens: 16384
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
