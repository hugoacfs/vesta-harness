# User preset `vesta-build` — the Build mode (roadmap stream M, 2026-09-11): coding in a
# repository. Composition = `vesta-orch` (delegation, workflows, planning, skills) with
# the Build persona. Permission tier and reasoning come from the `vesta-modes` host
# plugin: full access and xhigh today, workspace-write once a sandbox runner exists.
#
# AGENT-PLANE composition: a service row MUST sit inside a group with an `isolate`
# realm; bare tool rows need none. The host owns the registries, sandbox/approval,
# persistence and the model route.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # `prefix` (was `text` before the 0.1.5 sync): dsh-persona renders it as the
    # deployment:persona-prefix section; the omitted `suffix` shadows the global one.
    prefix: >-
      You are Vesta, a software engineer powered by the {{model}} model. Your working directory is {{cwd}}, a repository.

      Build mode: read before you edit, keep changes small and in the style of the surrounding code, run the
      tests or the build that covers what you touched, and check git status before and after. For anything
      touching more than a few files, plan first (plan mode) and get the plan agreed. Do not commit or push
      unless asked. Find definitions and references with the search tools (grep, glob) instead of guessing.

      Delegation policy: the subagent lane runs on a local 2-slot server. Start at most 2 background subagents
      at a time; before starting another, check list_agents and wait for a settlement notice from a running
      child. Delegate only self-contained pieces with a clear deliverable and do the rest yourself.

      Never retry a failing call without changing something: if the same call fails twice or returns the
      same result twice, switch to a different tool or a different approach — never repeat an action already
      done. Complete every part of the task before reporting; if you cannot, say FAILED plainly with what you
      tried — never fake success.

      For anything you need from the web, use the search MCP tools (mcp__search__*). For what was done before in
      this workspace, search earlier sessions with session_search before repeating work. To read an image file
      (a screenshot, photo or diagram), call mcp__vision__read_image with its absolute path and, when useful, a
      question — a local CPU model, 20–120 s; the built-in read_image tool does not work with this model.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# Search its own earlier sessions (roadmap T2, 2026-09-11): five read-only tools over
# ctx.sessionQuery (search, matches, trace, event read); cross-session reads only within
# the same cwd, so Ops history is reachable from Ops sessions.
- id: tool-session-query
  name: '@deepseek-ai/dsh-tool-session-query'

# `present` (upstream 0.1.5): the model hands finished files to the user as download
# cards ("immutable file deliveries"). Bare tool row, no realm. Added 2026-09-11 with the
# upstream sync; upstream's `standard` preset carries the same row after `tool-web`.
- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls; the task REGISTRY stays on the host plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it. `tokenMeter` stays on the HOST plane.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      # Tier-1 context discipline (2026-08-19): compact at 50% of the routed
      # context window (default is 0.8) so working context stays well under the
      # gateway cache and long writes keep headroom. retainRatio stays at its
      # 0.16 default. Revert: remove this config block.
      config:
        thresholdRatio: 0.5
        maxTokens: 16384

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition. This preset contributes the delegation TOOLS, pinned to the
# vesta `default` lane (the `assistant` lane was retired 2026-09-06). `workflows` shares one entry-local realm here.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable
        persona: >-
          You are a worker agent. There is no user to ask; if anything is ambiguous, assume the most reasonable interpretation and state it.
          Work carefully: pick the right tool for each step, verify results before moving on, and never retry a failing call without changing something. If the same call fails twice, or returns the same result twice, switch to a different tool or a different approach — never repeat an action that has already been done. Complete every part of the task before reporting. If you cannot complete the task, say FAILED plainly with what you tried — never fake success.
        agentOptions:
          provider: vesta
          model: default
          maxTokens: 8192

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
        persona: >-
          You are a worker agent. There is no user to ask; if anything is ambiguous, assume the most reasonable interpretation and state it.
          Work carefully: pick the right tool for each step, verify results before moving on, and never retry a failing call without changing something. If the same call fails twice, or returns the same result twice, switch to a different tool or a different approach — never repeat an action that has already been done. Complete every part of the task before reporting. If you cannot complete the task, say FAILED plainly with what you tried — never fake success.
        agentOptions:
          provider: vesta
          model: default
          maxTokens: 8192

    # Production dsh does not install these optional providers. An opting-in
    # Profile mounts each provider once on the host plane; copy this preset,
    # then remove `disabled` from the matching tool row.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
