# Vesta Harness user settings — template for $DSH_HOME/settings.yaml
# (DSH_HOME=~/.vesta-harness). Ported from the rc.7 ~/.dsh/settings.yaml on
# 2026-09-04. Contains no secrets: the provider key is read from the
# environment variable named by `apiKeyEnv`, which $DSH_HOME/.credentials.yaml
# supplies (copy that file by hand, chmod 600; never commit it).
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    vesta:
      displayName: Vesta (internal)
      api: openai-completions
      baseURL: http://192.168.0.2:4000/litellm/v1
      apiKeyEnv: VESTA_API_KEY
      # Provider default: Qwen keeps thinking in typed sessions. The level is a
      # label only: the qwen-chat-template format sends enable_thinking on/off
      # and never a level, and the served template then thinks at its own
      # default, which Qwen calls xhigh. A voice call switches its Session to
      # `off` for the call's duration (vesta-voice) and restores this afterwards.
      reasoning: xhigh
      # Cap the thinking phase so an answer always fits in maxTokens: pi-ai
      # sends vLLM's top-level thinking_token_budget = min(budget[level],
      # maxTokens - 1024); xhigh clamps to the `high` budget. Without it an
      # open-ended planning prompt can spend the whole output budget thinking
      # and end the turn with "output limit reached" (seen 2026-09-05).
      thinkingBudgets:
        minimal: 1024
        low: 2048
        medium: 8192
        high: 16384
      models:
        # contextWindow/maxTokens mirror the local-gateway LiteLLM caps
        # (vLLM lane 114688 in / 16384 out; Ornith lane 65536 in / 8192 out).
        - id: default
          name: Qwen 27B
          contextWindow: 114688
          # 32k output: thinking (capped below) plus a long answer must both fit;
          # vLLM allows 150k in+out, LiteLLM's 16,384 max_output_tokens is metadata.
          maxTokens: 32768
          reasoningEfforts:
            off: null
            xhigh: xhigh
          compat:
            thinkingFormat: qwen-chat-template
            supportsThinkingTokenBudget: true
        - id: assistant
          name: Ornith 9B
          contextWindow: 65536
          maxTokens: 8192
# Vesta is dark-first: the ember token layer carries both palettes, but the
# ambient ground and the brand gradient are designed for dark.
ui-theme:
  preference: dark
agent-default-model:
  provider: vesta
  model: default
agent-presets:
  default: vesta-orch
llm-deepseek:
  models: []
permission:
  defaultPreset: danger-full-access
