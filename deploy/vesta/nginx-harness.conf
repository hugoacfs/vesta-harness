# Reference copy of the harness routes in the tailnet reverse proxy
# (/srv/ai/compose/reverse-proxy/nginx.conf, server block for vesta.tail22b555.ts.net:443;
# that project is not under git). Pair with the systemd drop-ins in this directory:
# nginx strips the prefix, DSH_BASE_PATH makes the app emit it. Extracted 2026-09-11.

    location = /harness  { return 308 /harness/; }
    location /harness/ {
        rewrite ^/harness(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # /dsh stays a memorable entry point, now bouncing to /harness (was -> :8790).
    location = /dsh  { return 302 /harness/; }
    location = /dsh/ { return 302 /harness/; }
    location /dsh/   { return 302 /harness/; }

    location = /harness-staging  { return 308 /harness-staging/; }
    location /harness-staging/ {
        rewrite ^/harness-staging(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
