# Vesta user patch layer (machine-wide — applies to every profile).
# Host-plane MCP mounts, available to all presets/sessions.

# Telegram Notify MCP: send-only notifier (ai-telegram-mcp, loopback 7335),
# exposed as mcp__telegram-notify__notify. Added 2026-09-09.
- insert:
    - id: notify-telegram
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: telegram-notify
        transport: streamable-http
        url: http://127.0.0.1:7335/mcp
        headers: {}

# Web search is NOT mounted here: the dsh-vesta-app bundle already mounts the same
# server (127.0.0.1:7331) as `search` -> mcp__search__*. A second row here (2026-09-09..11,
# `vesta-search`) duplicated every search tool in the model's catalogue; removed 2026-09-11.

# Vision MCP: CPU-only image reading (ai-vision-mcp + ai-vision-ollama on loopback 7338;
# compose /srv/ai/compose/vision-mcp), exposed as mcp__vision__read_image(path, question?).
# Added 2026-09-11 (feature plan P5). Images must lie under the roots the container mounts
# read-only: ~/workspace, ~/code, the attachments dir of both homes, /srv/ai/pdf-mcp/work.
- insert:
    - id: mcp-vision
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vision
        transport: streamable-http
        url: http://127.0.0.1:7338/mcp
        headers: {}

# PDF MCP (roadmap T5, 2026-09-11): the standalone pdf-manipulation server (ai-pdf-mcp,
# loopback 7333, /srv/ai/pdf-mcp/work is its only visible path) → mcp__pdf__*.
- insert:
    - id: mcp-pdf
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pdf
        transport: streamable-http
        url: http://127.0.0.1:7333/mcp
        headers: {}

# Shell guard (roadmap T4, 2026-09-11): Claude Code style hooks from $DSH_HOME/hooks.json;
# today one PreToolUse hook on `bash` (hooks/guard-shell.py) denies commands that would
# wreck the box (rm -rf / or ~, mkfs, dd onto a disk, reboot, fork bomb, force-push, …).
# Template: deploy/vesta/hooks. Extend DENY in the script; `echo vesta-guard-canary` is the self-test.
- insert:
    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: /home/hugo/.vesta-harness/hooks.json
        projectDir: /home/hugo

# Own-history search (roadmap T2, fixed 2026-09-12): the shipped composition sets
# openAt: never, which disables session_search / session_event_search outright.
# One index file per home; opened at the first search.
- id: session-query-sqlite
  config:
    path: /home/hugo/.vesta-harness/session-search.db
    openAt: first-search

# Home Assistant MCP (roadmap T9, 2026-09-13): HA 2026.7.4's built-in mcp_server serves
# Streamable HTTP at /api/mcp — no mcp-proxy bridge needed (initialize + tools/list
# verified 2026-09-13: 20 tools — HassTurnOn/Off (lock device_class = lock/unlock),
# HassLightSet, media/remote, HassBroadcast, HassCancelAllTimers, lists, GetLiveContext).
# Auth: the long-lived token `vesta-mcp` (user hugo, created 2026-09-13, ~10-year expiry)
# lives in $DSH_HOME/.env as HOME_ASSISTANT_MCP_TOKEN (never in this file); app-boot's
# loadLayeredEnv materializes that .env into the process environment at launch, so the
# !!js header resolves. failOnStartupError stays false (default): if the token is absent
# at a given launch the row retries (reconnect on by default) instead of breaking the
# plugin tree. Confirm hook: hooks/guard-ha-mcp.py asks before lock / heating /
# irreversible calls (T9). Staging since 2026-09-13; production since 2026-09-18 (the
# P12–P14 promotion). With engine fit the `home` tool group sleeps until a keyword,
# tools_enable or /tools wakes it.
- insert:
    - id: mcp-home-assistant
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: home-assistant
        transport: streamable-http
        url: http://127.0.0.1:8123/api/mcp
        headers:
          Authorization: !!js '`Bearer ${process.env.HOME_ASSISTANT_MCP_TOKEN}`'
