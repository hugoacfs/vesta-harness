# Vesta user patch layer (machine-wide — applies to every profile).
# Host-plane MCP mounts, available to all presets/sessions.

# Telegram Notify MCP: send-only notifier (ai-telegram-mcp, loopback 7335),
# exposed as mcp__telegram-notify__notify. Added 2026-09-09.
- insert:
    - id: notify-telegram
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: telegram-notify
        transport: streamable-http
        url: http://127.0.0.1:7335/mcp
        headers: {}

# Web search is NOT mounted here: the dsh-vesta-app bundle already mounts the same
# server (127.0.0.1:7331) as `search` -> mcp__search__*. A second row here (2026-09-09..11,
# `vesta-search`) duplicated every search tool in the model's catalogue; removed 2026-09-11.

# Vision MCP: CPU-only image reading (ai-vision-mcp + ai-vision-ollama on loopback 7338;
# compose /srv/ai/compose/vision-mcp), exposed as mcp__vision__read_image(path, question?).
# Added 2026-09-11 (feature plan P5). Images must lie under the roots the container mounts
# read-only: ~/workspace, ~/code, the attachments dir of both homes, /srv/ai/pdf-mcp/work.
- insert:
    - id: mcp-vision
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vision
        transport: streamable-http
        url: http://127.0.0.1:7338/mcp
        headers: {}

# PDF MCP (roadmap T5, 2026-09-11): the standalone pdf-manipulation server (ai-pdf-mcp,
# loopback 7333, /srv/ai/pdf-mcp/work is its only visible path) → mcp__pdf__*.
- insert:
    - id: mcp-pdf
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: pdf
        transport: streamable-http
        url: http://127.0.0.1:7333/mcp
        headers: {}

# Shell guard (roadmap T4, 2026-09-11): Claude Code style hooks from $DSH_HOME/hooks.json;
# today one PreToolUse hook on `bash` (hooks/guard-shell.py) denies commands that would
# wreck the box (rm -rf / or ~, mkfs, dd onto a disk, reboot, fork bomb, force-push, …).
# Template: deploy/vesta/hooks. Extend DENY in the script; `echo vesta-guard-canary` is the self-test.
- insert:
    - id: hooks-claude-code
      name: '@deepseek-ai/dsh-hooks-claude-code'
      config:
        configPath: /home/hugo/.vesta-harness/hooks.json
        projectDir: /home/hugo
