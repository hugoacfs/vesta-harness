# One worker serving both voice models on the 3060: streaming TTS (Kyutai
# tts-1.6b-en_fr, Python-backed module) at /api/tts_streaming and streaming STT
# with semantic end-of-turn (Kyutai stt-1b-en_fr) at /api/asr-streaming.
# Reached only over loopback from the LiveKit agent; the token is not a secret boundary.
static_dir = "/app/static/"
log_dir = "/tmp/moshi-logs"
instance_name = "vesta"
authorized_ids = ["public_token"]

[modules.tts_py]
type = "Py"
path = "/api/tts_streaming"
text_tokenizer_file = "hf://kyutai/tts-1.6b-en_fr/tokenizer_spm_8k_en_fr_audio.model"
# Parallel utterances; one call speaks one thing at a time, two leaves headroom for the greeting overlap.
batch_size = 2
text_bos_token = 1

[modules.tts_py.py]
log_folder = "/tmp/moshi-logs"
voice_folder = "hf-snapshot://kyutai/tts-voices/**/*.safetensors"
default_voice = "expresso/ex03-ex01_calm_001_channel1_1143s.wav"
# 2.0 is the value the distilled model was trained for; other values do not work.
cfg_coef = 2.0
cfg_is_no_text = true
padding_between = 1
# Codebooks per frame: 24 is Unmute's production setting (32 max).
n_q = 24
# Speech rate: negative is faster. Left at 0; the agent applies its own speed factor.
padding_bonus = 0

[modules.asr]
path = "/api/asr-streaming"
type = "BatchedAsr"
lm_model_file = "hf://kyutai/stt-1b-en_fr-candle/model.safetensors"
text_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/tokenizer_en_fr_audio_8000.model"
audio_tokenizer_file = "hf://kyutai/stt-1b-en_fr-candle/mimi-pytorch-e351c8d8@125.safetensors"
# Words are emitted this many frames (80 ms each) behind the audio: 6 ≈ 0.5 s.
asr_delay_in_tokens = 6
batch_size = 8
conditioning_learnt_padding = true
temperature = 0.0

[modules.asr.model]
audio_vocab_size = 2049
text_in_vocab_size = 8001
text_out_vocab_size = 8000
audio_codebooks = 32

[modules.asr.model.transformer]
d_model = 2048
num_heads = 16
num_layers = 16
dim_feedforward = 8192
causal = true
norm_first = true
bias_ff = false
bias_attn = false
context = 750
max_period = 100000
use_conv_block = false
use_conv_bias = true
gating = "silu"
norm = "RmsNorm"
positional_embedding = "Rope"
conv_layout = false
conv_kernel_size = 3
kv_repeat = 1
max_seq_len = 40960

[modules.asr.model.extra_heads]
num_heads = 4
dim = 6
